name: build-bcmdhd-p660

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev build-essential \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu python3 curl

      - name: Build bcmdhd.ko
        run: |
          chmod +x scripts/*.sh
          WORK=$PWD/work bash scripts/build.sh 2>&1 | tee build.log
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bcmdhd-p660
          path: |
            work/out/*.ko
            build.log
          if-no-files-found: warn

      - name: Fail if build failed
        if: always()
        run: |
          if ! grep -q "^DONE:" build.log 2>/dev/null; then
            echo "::error::build did not complete"
            exit 1
          fi
