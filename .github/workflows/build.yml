name: build-bcmdhd-p660

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev build-essential \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu python3 curl

      - name: Build bcmdhd.ko
        run: |
          chmod +x scripts/*.sh
          set -o pipefail
          WORK=$PWD/work bash -x scripts/build.sh 2>&1 | tee build.log
        continue-on-error: true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bcmdhd-p660
          path: |
            work/out/*.ko
            build.log
          if-no-files-found: warn

      - name: Publish log to ci-logs branch
        if: always()
        run: |
          mkdir -p logs
          cp build.log logs/build.log 2>/dev/null || echo "build.log missing" > logs/build.log
          cp work/out/*.ko logs/ 2>/dev/null || true
          ls -la logs
          git config user.name "ci-bot"
          git config user.email "ci-bot@local"
          git add -f logs
          git commit -m "ci: build log" || echo "nothing to commit"
          git push origin HEAD:refs/heads/ci-logs --force

      - name: Fail if build failed
        if: always()
        run: |
          if ! grep -q "^DONE:" build.log 2>/dev/null; then
            echo "::error::build did not complete - see ci-logs branch"
            exit 1
          fi
